name: Preparacion Vibe CLI sin inferencia
on:
  push:
    branches: [automatizacion/coordinacion-api-v1]
    paths:
      - automation/coordination/vibe_connection.py
      - .github/workflows/vibe-readiness.yml
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check mistral-vibe==3.1.2
      - run: vibe --version
      - name: Preparacion, nunca autenticacion ni inferencia
        env:
          MISTRAL_VIBE_CLI_KEY: ${{ secrets.MISTRAL_VIBE_CLI_KEY }}
        run: python automation/coordination/vibe_connection.py --output "$RUNNER_TEMP/vibe-readiness.json"
