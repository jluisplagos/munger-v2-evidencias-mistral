# Preservación duradera de los 11 PDF oficiales de Elis (E-ELIS; decisión U1 de la persona responsable, 17-nov-2026).
# Descarga cada PDF de su URL oficial, exige su SHA-256 exacta (SHA256SUMS) y solo entonces crea la Release y sube los 11 archivos.
# No usa tokens personales: solo el GITHUB_TOKEN del propio repositorio. No escribe en Git. Se ejecuta solo en esta rama.
name: preservar-fuentes-elis
on:
  push:
    branches: [coordinacion/release-fuentes-elis]
    paths: [coordinacion/cierre_v2/fuentes_elis/**, .github/workflows/preservar_fuentes_elis.yml]
permissions:
  contents: write
jobs:
  preservar:
    runs-on: ubuntu-latest
    env:
      TAG: fuentes-elis-e-20261117
      DIR: coordinacion/cierre_v2/fuentes_elis
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar desde las URL oficiales y exigir la SHA-256
        run: |
          set -euo pipefail
          mkdir -p pdf
          python3 - <<'PY'
          import csv, subprocess
          for r in csv.DictReader(open("coordinacion/cierre_v2/fuentes_elis/INDICE_11_PDF.csv", encoding="utf-8")):
              subprocess.run(["curl", "-sS", "-L", "--fail", "--max-time", "300", "-o", "pdf/" + r["archivo"], r["url_oficial"]], check=True)
          PY
          cd pdf && sha256sum -c "../$DIR/SHA256SUMS"
      - name: Crear la Release y subir los 11 PDF (no sobrescribe)
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La Release $TAG ya existe: no se sobrescribe"; exit 1; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Fuentes oficiales Elis (E-ELIS) · 11 PDF verificados · 2026-11-17" \
            --notes-file "$DIR/NOTAS_RELEASE.md" pdf/*.pdf "$DIR/INDICE_11_PDF.csv" "$DIR/SHA256SUMS"
      - name: Comprobar lo publicado
        run: |
          set -euo pipefail
          mkdir comprobacion && gh release download "$TAG" --dir comprobacion
          cd comprobacion && sha256sum -c "../$DIR/SHA256SUMS" && ls | wc -l
