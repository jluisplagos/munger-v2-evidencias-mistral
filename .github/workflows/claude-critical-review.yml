name: Auditoria critica Claude API
# AUTO1-M6: solo a mano y tras aprobar el environment protegido; nunca con push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: munger-audit-pilot-code-001
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s automation/claude_review -p 'test_*.py' -v
      - run: python3 -I -m unittest discover -s automation/coordination -p 'test_*.py' -v
  review:
    needs: tests
    runs-on: ubuntu-latest
    # Plazo del stream (720 s) + timeout de socket (60 s) + publicacion < 20 min.
    timeout-minutes: 20
    environment: inferencia-aprobada
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Auditoria documental acotada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUNGER_TOPE_ACUMULADO_ANTHROPIC_USD: ${{ vars.MUNGER_TOPE_ACUMULADO_ANTHROPIC_USD }}
        run: >-
          python3 automation/coordination/critical_review.py
          --code-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/munger-critical-review"
          --execute-api
      - name: Resumen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/munger-critical-review/report.md" ]; then
            cat "$RUNNER_TEMP/munger-critical-review/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: munger-critical-review-${{ github.run_id }}
          path: ${{ runner.temp }}/munger-critical-review/
          if-no-files-found: warn
          retention-days: 30
