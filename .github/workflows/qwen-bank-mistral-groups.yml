name: Contraste Mistral Qwen por tandas
# AUTO1-M6: solo a mano y tras aprobar el environment protegido; nunca con push.
# AUTO1-M7: Mistral (con instalacion de terceros) y Claude (con ANTHROPIC_API_KEY) van
# en jobs distintos. El job Claude no instala nada. Lo que pasa entre jobs son datos:
# el job Mistral publica su informe como artefacto y en la rama de registro, y el job
# Claude lo lee de esa rama fijando el SHA de la instantanea (qwen_peer_review.py).
# No se anade download-artifact: su SHA fijado no se ha podido verificar sin red.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s automation/coordination -p 'test_*.py' -v
  mistral:
    needs: tests
    concurrency:
      group: munger-qwen-groups-${{ matrix.group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: inferencia-aprobada
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        group: [1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Sin secretos en este paso. Entorno virtual aparte y solo ruedas: no se ejecuta
      # codigo de construccion y el Python que orquesta no carga paquetes de terceros.
      # Pendiente (AUTO1-M7): --require-hashes con un archivo de hashes verificado.
      - name: Instalar Vibe CLI aislado, sin secretos
        run: |
          python -m venv "$RUNNER_TEMP/vibe-venv"
          "$RUNNER_TEMP/vibe-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: mistral-vibe==3.1.2
      - name: Un contraste parcial sin herramientas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_VIBE_CLI_KEY: ${{ secrets.MISTRAL_VIBE_CLI_KEY }}
        run: |
          PY="$(command -v python)"
          PATH="$RUNNER_TEMP/vibe-venv/bin:$PATH" "$PY" automation/coordination/qwen_group_review.py \
            --group "${{ matrix.group }}" --code-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/munger-qwen-group-${{ matrix.group }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: munger-qwen-group-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/munger-qwen-group-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 30
  claude:
    needs: mistral
    concurrency:
      group: munger-qwen-peer-${{ matrix.group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: inferencia-aprobada
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        group: [1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Revision por Claude API en contexto distinto, sin instalar paquetes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUNGER_TOPE_ACUMULADO_ANTHROPIC_USD: ${{ vars.MUNGER_TOPE_ACUMULADO_ANTHROPIC_USD }}
        run: >-
          python3 automation/coordination/qwen_peer_review.py
          --group "${{ matrix.group }}" --code-sha "$GITHUB_SHA"
          --output "$RUNNER_TEMP/munger-qwen-peer-${{ matrix.group }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: munger-qwen-peer-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/munger-qwen-peer-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 30
