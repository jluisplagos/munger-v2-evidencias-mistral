name: Pruebas de automatizacion sin secretos
# AUTO1-M6: lo unico que se dispara con push. Sin secretos, sin instalaciones y solo lectura.
on:
  push:
    branches: [automatizacion/coordinacion-api-v1, automatizacion/piloto-claude-api]
    paths:
      - automation/**
      - .github/workflows/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s automation/claude_review -p 'test_*.py' -v
      - run: python3 -I -m unittest discover -s automation/coordination -p 'test_*.py' -v
