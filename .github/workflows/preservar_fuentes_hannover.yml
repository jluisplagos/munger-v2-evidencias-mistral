# Preservación duradera de las fuentes oficiales de HannoverBank (U3; decisión de la persona responsable, 17-nov-2026).
# Descarga cada PDF de su URL oficial, exige su SHA-256 exacta (SHA256SUMS) y solo entonces crea la Release.
# No usa tokens personales: solo el GITHUB_TOKEN del propio repositorio. No escribe en Git. Se ejecuta solo en esta rama.
name: preservar-fuentes-hannover
on:
  push:
    branches: [coordinacion/release-fuentes-hannover]
    paths: [coordinacion/cierre_v2/fuentes_hannover/**, .github/workflows/preservar_fuentes_hannover.yml]
permissions:
  contents: write
jobs:
  preservar:
    runs-on: ubuntu-latest
    env:
      TAG: fuentes-hannover-u3-20261117
      DIR: coordinacion/cierre_v2/fuentes_hannover
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar desde las URL oficiales y exigir la SHA-256
        run: |
          set -euo pipefail
          mkdir -p pdf
          python3 - <<'PY'
          import csv, subprocess
          for r in csv.DictReader(open("coordinacion/cierre_v2/fuentes_hannover/INDICE_PDF.csv", encoding="utf-8")):
              subprocess.run(["curl", "-sS", "-L", "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", "--fail", "--max-time", "600", "-o", "pdf/" + r["archivo"], r["url_oficial"]], check=True)
          PY
          cd pdf && sha256sum -c "../$DIR/SHA256SUMS"
      - name: Crear la Release y subir los archivos (no sobrescribe)
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "La Release $TAG ya existe: no se sobrescribe"; exit 1; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Fuentes oficiales HannoverBank (U3, prueba negativa C) · verificadas · 2026-11-17" \
            --notes-file "$DIR/NOTAS_RELEASE.md" pdf/* "$DIR/INDICE_PDF.csv" "$DIR/SHA256SUMS"
      - name: Comprobar lo publicado
        run: |
          set -euo pipefail
          mkdir comprobacion && gh release download "$TAG" --dir comprobacion
          cd comprobacion && sha256sum -c "../$DIR/SHA256SUMS" && ls | wc -l
