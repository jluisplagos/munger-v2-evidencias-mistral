name: Contraste documental Mistral del banco Qwen
on:
  push:
    branches: [automatizacion/coordinacion-api-v1]
    paths:
      - automation/coordination/qwen_bank_review.py
      - automation/coordination/test_qwen_bank_review.py
      - automation/coordination/requests/qwen-bank-review-001.json
      - .github/workflows/qwen-bank-mistral-review.yml
permissions:
  contents: read
concurrency:
  group: munger-qwen-bank-review-001
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s automation/coordination -p test_qwen_bank_review.py -v
      - run: python -m pip install --disable-pip-version-check mistral-vibe==3.1.2
      - name: Contraste sin herramientas ni ejecucion del producto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_VIBE_CLI_KEY: ${{ secrets.MISTRAL_VIBE_CLI_KEY }}
        run: >-
          python automation/coordination/qwen_bank_review.py
          --code-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/munger-qwen-bank-review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: munger-qwen-bank-review-${{ github.run_id }}
          path: ${{ runner.temp }}/munger-qwen-bank-review/
          if-no-files-found: warn
          retention-days: 30
